<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stakan Cafe</title>
<style>
  :root{
    --espresso:#2b1c14;
    --espresso-deep:#1a110c;
    --cream:#f3e6d4;
    --amber:#c98a3c;
    --glass:#e9c99a;
    --steam:#efe2cf;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{height:100%;}

  body{
    font-family:'Georgia','Times New Roman',serif;
    background:
      radial-gradient(ellipse at 50% 0%, #3a2718 0%, var(--espresso) 45%, var(--espresso-deep) 100%);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:40px 20px;
  }

  .stage{
    max-width:640px;
    width:100%;
    text-align:center;
    position:relative;
  }

  /* --- Signature element: a glass cup with rising steam --- */
  .cup-wrap{
    position:relative;
    width:120px;
    height:150px;
    margin:0 auto 18px;
  }

  .steam{
    position:absolute;
    bottom:78px;
    width:6px;
    height:60px;
    border-radius:6px;
    background:linear-gradient(to top, rgba(239,226,207,0.55), rgba(239,226,207,0));
    filter:blur(1px);
    animation:rise 3.4s ease-in-out infinite;
    opacity:0;
  }
  .steam:nth-child(1){left:38px; animation-delay:0s;}
  .steam:nth-child(2){left:57px; animation-delay:1.1s; height:70px;}
  .steam:nth-child(3){left:76px; animation-delay:2.2s;}

  @keyframes rise{
    0%{ transform:translateY(0) scaleX(1); opacity:0; }
    15%{ opacity:0.7; }
    50%{ transform:translateY(-30px) scaleX(1.4); opacity:0.5; }
    100%{ transform:translateY(-70px) scaleX(1.8); opacity:0; }
  }

  .cup{
    position:absolute;
    bottom:0;
    left:20px;
    width:80px;
    height:70px;
    background:linear-gradient(180deg, rgba(233,201,154,0.18), rgba(233,201,154,0.06));
    border:1.5px solid var(--glass);
    border-top:none;
    border-radius:0 0 34px 34px;
    box-shadow:inset 0 -18px 22px rgba(201,138,60,0.25), 0 6px 18px rgba(0,0,0,0.35);
    backdrop-filter:blur(2px);
  }
  .cup::before{
    /* rim */
    content:"";
    position:absolute;
    top:-6px;
    left:-1.5px;
    width:77px;
    height:12px;
    border:1.5px solid var(--glass);
    border-radius:50%;
    background:rgba(233,201,154,0.12);
  }
  .cup::after{
    /* handle */
    content:"";
    position:absolute;
    right:-26px;
    top:14px;
    width:24px;
    height:30px;
    border:6px solid transparent;
    border-left:1.5px solid var(--glass);
    border-top:1.5px solid var(--glass);
    border-bottom:1.5px solid var(--glass);
    border-radius:0 50% 50% 0;
  }

  .eyebrow{
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--amber);
    font-family:Verdana, sans-serif;
    margin-bottom:6px;
  }

  h1{
    font-size:clamp(2.4rem, 7vw, 3.6rem);
    font-weight:400;
    letter-spacing:0.04em;
    color:var(--cream);
    margin-bottom:6px;
  }
  h1 span{
    color:var(--amber);
    font-style:italic;
  }

  .rule{
    width:60px;
    height:1px;
    background:var(--amber);
    opacity:0.6;
    margin:22px auto;
  }

  .status{
    font-size:1.05rem;
    line-height:1.75;
    color:var(--steam);
    max-width:480px;
    margin:0 auto 34px;
    font-family:'Segoe UI', Verdana, sans-serif;
    font-weight:300;
  }

  .status strong{
    color:var(--amber);
    font-weight:600;
  }

  .contact-card{
    background:linear-gradient(180deg, rgba(233,201,154,0.07), rgba(233,201,154,0.02));
    border:1px solid rgba(233,201,154,0.25);
    border-radius:16px;
    padding:28px 24px;
    backdrop-filter:blur(6px);
  }

  .contact-title{
    font-family:Verdana, sans-serif;
    font-size:11px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:20px;
  }

  .contact-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .contact-list li{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-family:'Segoe UI', Verdana, sans-serif;
    font-size:1rem;
    color:var(--cream);
    flex-wrap:wrap;
  }

  .contact-list li a{
    color:var(--cream);
    text-decoration:none;
    border-bottom:1px solid rgba(233,201,154,0.35);
    transition:color 0.2s ease, border-color 0.2s ease;
    padding-bottom:1px;
  }
  .contact-list li a:hover,
  .contact-list li a:focus-visible{
    color:var(--amber);
    border-color:var(--amber);
  }

  .tag{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(201,138,60,0.16);
    border:1px solid rgba(201,138,60,0.4);
    color:var(--amber);
    font-family:Verdana, sans-serif;
    font-size:12px;
    font-weight:bold;
    flex-shrink:0;
  }

  footer{
    margin-top:30px;
    font-size:12px;
    letter-spacing:0.15em;
    color:rgba(239,226,207,0.35);
    font-family:Verdana, sans-serif;
    text-transform:uppercase;
  }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .steam{animation:none; opacity:0;}
  }

  @media (max-width:480px){
    .contact-list li{font-size:0.92rem;}
  }
</style>
</head>
<body>

  <div class="stage">

    <div class="eyebrow">Cafe</div>
    <h1>Stakan <span>Cafe</span></h1>

    <div class="rule"></div>

    <div class="contact-card">

          <a href="https://t.me/anaskhon1" target="_blank" rel="noopener">@anaskhon1</a>
        </li>
        <li>
          <span class="tag">вЋ</span>
          <a href="tel:+998336262223">+998 33 626 22 23</a>
        </li>
        <li>
          <span class="tag">@</span>
          <a href="mailto:karakhujayev@gmail.com">karakhujayev@gmail.com</a>
        </li>
      </ul>
    </div>

    <footer>Stakan Cafe &mdash; vaqtincha to'xtatilgan</footer>

  </div>

</body>
</html>
